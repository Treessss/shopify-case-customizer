services:
  - type: web
    name: shopify-facebook-catalog
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: 2026-04
      - key: SHOPIFY_DEFAULT_PRODUCT_QUERY
        value: status:active
